<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hadar Live Decision Engine v2</title>
<style>
body{margin:0;background:#071017;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.logo{font-size:24px;font-weight:800}.sub{color:#91a9bd}.vix,.card{background:#0d1923;border:1px solid #1b3447;border-radius:18px;padding:16px;box-shadow:0 8px 30px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}.sym{font-size:22px;font-weight:800}.score{font-size:36px;font-weight:900}.LONG{color:#4cff9b}.SHORT{color:#ff6d7a}.WAIT{color:#ffd36d}.stage{display:inline-block;padding:5px 9px;border-radius:999px;background:#132b3a;color:#cde7f7}.row{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.small{font-size:13px;color:#9db1c2}.bar{height:8px;background:#152837;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4ea3ff,#76ffbe)}.reason{font-size:12px;color:#b9cad6;margin-top:5px}.err{color:#ff9c9c}.pill{padding:6px 9px;background:#122332;border-radius:999px}</style></head><body><div class="wrap">
<div class="top"><div><div class="logo">⚡ Hadar Live Decision Engine v2</div><div class="sub">12H / 4H / Daily + 1H candle direction בלבד • Fib / Sweeps / S-R / Flags & Wedges • No 15m • No 1H RSI</div></div><button onclick="notify()">🔔 הפעל התראות דפדפן</button></div>
<div id="vix" class="vix" style="margin-top:16px">טוען VIX…</div><div id="grid" class="grid"></div><div id="errors" class="err"></div></div>
<script>
function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function render(s){let v=s.vix||{};document.getElementById('vix').innerHTML=`<b>VIX FILTER</b> <span class="pill">${esc(v.bias||'neutral')}</span> score ${esc(v.score||0)} ${v.vix?`| VIX ${v.vix}`:''}<div class="small">מקור: ${esc(v.source||'-')} | 4H div: ${esc(v.div4h||'-')} | 12H div: ${esc(v.div12h||'-')}</div>`;
let a=Object.values(s.results||{}).sort((x,y)=>y.score-x.score);document.getElementById('grid').innerHTML=a.map(r=>`<div class="card"><div class="row"><span class="sym">${esc(r.symbol)}</span><span class="stage">${esc(r.stage)}</span></div><div class="row"><span class="${r.direction}">${esc(r.direction)}</span><span class="score">${r.score}</span></div><div class="bar"><div class="fill" style="width:${r.score}%"></div></div><div class="row small"><span>L ${r.long_score}</span><span>S ${r.short_score}</span><span>Gap ${r.gap}</span></div><div class="row"><span>1H candles</span><b>${esc(r.one_hour_candles)}</b></div><div class="row"><span>Fib 0.50–0.618</span><b>${esc(r.fib?.status)} / ${esc(r.fib?.direction)}</b></div><div class="row"><span>Wyckoff</span><b>${esc(r.wyckoff)}</b></div><div class="row"><span>Liquidity sweep</span><b>${esc(r.liquidity_sweep?.type)} (${esc(r.liquidity_sweep?.strength)})</b></div><div class="row"><span>Pattern</span><b>${esc(r.pattern?.pattern)} (${esc(r.pattern?.confidence)})</b></div><div class="row"><span>S / R</span><b>${esc(r.support_resistance?.support?.price||'-')} / ${esc(r.support_resistance?.resistance?.price||'-')}</b></div><div class="row"><span>4H Volume</span><b>x${esc(r.volume_ratio_4h)}</b></div>${(r.reasons||[]).slice(-5).map(x=>`<div class="reason">• ${esc(x)}</div>`).join('')}</div>`).join('');
document.getElementById('errors').innerText=Object.entries(s.errors||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}
async function load(){let r=await fetch('/api/state');render(await r.json())}load();setInterval(load,15000);
function notify(){Notification.requestPermission()}
</script></body></html>
